[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-tools"
version = "0.3.0"
description = "Simple transcription with Whisper"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Kirill Yuzhakov", email = "luxlapari@gmail.com" }]
dependencies = [
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "openai>=1.0.0",
    "numpy>=1.21.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]
diarize = ["pyannote.audio>=3.1.0"]
yaml = ["pyyaml>=6.0.0"]

[project.scripts]
whisper-tools = "whisper_tools.cli:main"

[tool.setuptools.packages.find]
include = ["whisper_tools*"]